name: Fantezi XML guncelle

on:
  schedule:
    - cron: "17 */3 * * *"   # her 3 saatte bir
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: XML'i cek ve suz
        run: |
          mkdir -p public
          python3 filter.py
          python3 tegan.py
          echo '<meta charset="utf-8"><a href="fantezi.xml">fantezi.xml</a><br><a href="tegan.xml">tegan.xml</a>' > public/index.html
          ls -la public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
